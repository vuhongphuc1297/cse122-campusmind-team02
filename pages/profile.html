<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Cá Nhân & Cài Đặt | CampusMind TLU</title>

  <!-- Google Fonts: Fraunces & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: '#2F7A66',
            'sage-deep': '#1C5344',
            'amber-ai': '#D79B34',
            'clay-alert': '#C4643F',
            ink: '#16241D',
            paper: '#F2EEE6',
            'sage-tint': '#DCEAE3',
            'sky-info': '#3B6E92',
            'card-border': '#E4DDD4',
          },
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CampusMind Core Styles -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-paper text-ink min-h-screen flex flex-col font-sans">

  <!-- Crisis Banner -->
  <div id="crisis-banner"></div>

  <!-- Header -->
  <header id="campusmind-header" class="bg-white/95 backdrop-blur-md border-b border-card-border sticky top-0 z-40"></header>

  <!-- Main Content -->
  <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 flex-1 space-y-6">

    <!-- Top Bar -->
    <div class="space-y-1">
      <div class="flex items-center gap-2 text-xs font-bold text-sage">
        <span>TÀI KHOẢN NGƯỜI DÙNG</span>
        <span>·</span>
        <span>THÔNG TIN CÁ NHÂN & BẢO MẬT</span>
      </div>
      <h1 class="font-serif text-2xl sm:text-3xl font-bold text-ink">Hồ sơ cá nhân & Cài đặt hệ thống</h1>
      <p class="text-xs sm:text-sm text-ink/70">Quản lý thông tin định danh, số điện thoại khẩn cấp và các tùy chọn thông báo lịch hẹn</p>
    </div>

    <!-- PROFILE HERO CARD -->
    <section class="bg-white rounded-3xl p-6 sm:p-8 border border-card-border shadow-sm flex flex-col sm:flex-row items-center gap-6">
      <img id="profile-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-2xl object-cover border-2 border-sage-tint shadow-sm">
      <div class="space-y-1.5 text-center sm:text-left flex-1">
        <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
          <h2 id="profile-name" class="font-serif font-bold text-2xl text-ink">...</h2>
          <span id="profile-role-badge" class="badge-sage">...</span>
        </div>
        <p id="profile-faculty" class="text-xs text-ink/70">...</p>
        <p id="profile-code" class="text-xs text-ink/50 font-mono">Mã định danh: ...</p>
      </div>

      <button onclick="handleLogout()" class="btn-secondary text-xs !py-2 !px-4 text-clay-alert hover:border-clay-alert">
        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        <span>Đăng xuất</span>
      </button>
    </section>

    <!-- FORM SETTINGS -->
    <section class="bg-white rounded-3xl p-6 sm:p-8 border border-card-border shadow-sm space-y-6">
      <h3 class="font-serif font-bold text-lg text-ink">Cập nhật thông tin liên lạc</h3>

      <form onsubmit="handleUpdateProfile(event)" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="font-bold text-ink block mb-1">Họ và tên:</label>
            <input type="text" id="edit-name" class="w-full bg-paper border border-card-border rounded-xl p-2.5 text-ink focus:outline-none focus:border-sage">
          </div>
          <div>
            <label class="font-bold text-ink block mb-1">Số điện thoại liên lạc:</label>
            <input type="text" id="edit-phone" class="w-full bg-paper border border-card-border rounded-xl p-2.5 text-ink focus:outline-none focus:border-sage">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="font-bold text-ink block mb-1">Email trường:</label>
            <input type="email" id="edit-email" class="w-full bg-paper border border-card-border rounded-xl p-2.5 text-ink focus:outline-none focus:border-sage">
          </div>
          <div>
            <label class="font-bold text-ink block mb-1">Đơn vị / Khoa đào tạo:</label>
            <input type="text" id="edit-faculty" class="w-full bg-paper border border-card-border rounded-xl p-2.5 text-ink focus:outline-none focus:border-sage">
          </div>
        </div>

        <!-- Notification Options -->
        <div class="pt-4 border-t border-card-border space-y-2">
          <label class="font-bold text-ink block">Tùy chọn thông báo:</label>
          <div class="space-y-2">
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" checked class="rounded text-sage focus:ring-sage">
              <span>Nhận thông báo qua Email khi chuyên viên phê duyệt hoặc phản hồi ca hẹn</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" checked class="rounded text-sage focus:ring-sage">
              <span>Nhận nhắc nhở lịch tham vấn trước 24 giờ</span>
            </label>
          </div>
        </div>

        <div class="pt-4 border-t border-card-border flex justify-end">
          <button type="submit" class="btn-primary text-xs !py-2 !px-5 shadow-sm">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>Lưu các thay đổi</span>
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- Footer -->
  <div id="campusmind-footer"></div>

  <!-- Scripts -->
  <script src="../js/modules/data.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CampusCommon.renderEmergencyBanner();
      CampusCommon.renderHeader('profile');
      CampusCommon.renderFooter();

      const user = CampusAuth.getUser();
      document.getElementById('profile-avatar').src = user.avatar;
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('profile-role-badge').textContent = user.roleName;
      document.getElementById('profile-faculty').textContent = user.faculty;
      document.getElementById('profile-code').textContent = `Mã định danh: ${user.code}`;

      document.getElementById('edit-name').value = user.name;
      document.getElementById('edit-phone').value = user.phone || '0987.654.321';
      document.getElementById('edit-email').value = user.email;
      document.getElementById('edit-faculty').value = user.faculty;
    });

    function handleUpdateProfile(e) {
      e.preventDefault();
      const user = CampusAuth.getUser();
      user.name = document.getElementById('edit-name').value.trim();
      user.phone = document.getElementById('edit-phone').value.trim();
      user.email = document.getElementById('edit-email').value.trim();
      user.faculty = document.getElementById('edit-faculty').value.trim();

      CampusData.saveUser(user);
      CampusCommon.showToast('Đã cập nhật hồ sơ cá nhân thành công!', 'success');
      setTimeout(() => window.location.reload(), 400);
    }

    function handleLogout() {
      CampusAuth.switchRole('guest', 'index.html');
    }
  </script>
</body>
</html>
