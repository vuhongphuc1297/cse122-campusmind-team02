<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Hẹn Của Tôi & Drawer Chi Tiết | CampusMind TLU</title>

  <!-- Google Fonts: Fraunces & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: '#2F7A66',
            'sage-deep': '#1C5344',
            'amber-ai': '#D79B34',
            'clay-alert': '#C4643F',
            ink: '#16241D',
            paper: '#F2EEE6',
            'sage-tint': '#DCEAE3',
            'sky-info': '#3B6E92',
            'card-border': '#E4DDD4',
          },
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CampusMind Core Styles -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-paper text-ink min-h-screen flex flex-col font-sans">

  <!-- Crisis Banner -->
  <div id="crisis-banner"></div>

  <!-- Header -->
  <header id="campusmind-header" class="bg-white/95 backdrop-blur-md border-b border-card-border sticky top-0 z-40"></header>

  <!-- Main Content (Matching Mockup 14) -->
  <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 flex-1 space-y-6">

    <!-- Top Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="space-y-1">
        <div class="flex items-center gap-2 text-xs font-bold text-sage">
          <span>THEO DÕI TIẾN TRÌNH THAM VẤN</span>
          <span>·</span>
          <span>SLIDE 08</span>
        </div>
        <h1 class="font-serif text-2xl sm:text-3xl font-bold text-ink">Quản lý lịch hẹn cá nhân</h1>
        <p class="text-xs sm:text-sm text-ink/70">Theo dõi trạng thái các ca hẹn đã đặt, trao đổi thông tin bảo mật và điều chỉnh thời gian thuận tiện</p>
      </div>

      <div class="flex items-center gap-2 self-start sm:self-auto">
        <button onclick="CampusCommon.exportToCSV('danh-sach-lich-hen-sinh-vien.csv', CampusData.getAppointments())" class="btn-secondary text-xs shadow-sm" title="Xuất dữ liệu lịch hẹn ra file CSV">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Xuất CSV</span>
        </button>
        <a href="student-booking.html" class="btn-primary text-xs shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Đăng ký ca mới</span>
        </a>
      </div>
    </div>

    <!-- FILTER TABS & SEARCH (Status Coverage: Pending / Confirmed / Cancelled / Completed) -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      <!-- Status Tabs -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="status-filter-tabs">
        <button onclick="setFilter('all', this)" class="filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-sage-tint text-sage-deep border border-sage">
          Tất cả <span id="count-all">(0)</span>
        </button>
        <button onclick="setFilter('confirmed', this)" class="filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-card-border text-ink/80 hover:bg-paper">
          Sắp tới <span id="count-confirmed">(0)</span>
        </button>
        <button onclick="setFilter('pending', this)" class="filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-card-border text-ink/80 hover:bg-paper">
          Chờ duyệt <span id="count-pending">(0)</span>
        </button>
        <button onclick="setFilter('completed', this)" class="filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-card-border text-ink/80 hover:bg-paper">
          Đã hoàn thành <span id="count-completed">(0)</span>
        </button>
        <button onclick="setFilter('cancelled', this)" class="filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-card-border text-ink/80 hover:bg-paper">
          Đã hủy <span id="count-cancelled">(0)</span>
        </button>
        <button onclick="resetAppointmentFilters()" id="btn-reset-apt-filter" class="hidden px-3 py-1.5 rounded-full text-xs font-semibold border border-clay-alert/30 bg-clay-alert/10 text-clay-alert hover:bg-clay-alert/20 transition-all flex items-center gap-1 shrink-0">
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
          <span>Xóa bộ lọc</span>
        </button>
      </div>

      <!-- Quick Search -->
      <div class="relative w-full sm:w-64">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-ink/40"></i>
        <input type="text" id="appointment-search" oninput="renderAppointmentsList()" placeholder="Tìm theo mã ca, chuyên viên..."
               class="w-full bg-white border border-card-border rounded-xl pl-9 pr-3 py-1.5 text-xs text-ink focus:outline-none focus:border-sage shadow-sm">
      </div>
    </div>

    <!-- APPOINTMENTS LIST CONTAINER -->
    <div id="appointments-container" class="space-y-4">
      <!-- Rendered by JS -->
    </div>

  </main>

  <!-- ================= SIDE DRAWER: CHI TIẾT LỊCH HẸN (Mockup 14) ================= -->
  <div id="appointment-drawer" class="drawer-backdrop hidden" onclick="if(event.target === this) closeDrawer()">
    <div class="drawer-content p-6 sm:p-7 flex flex-col justify-between">
      <div class="space-y-5" id="drawer-body">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- MODAL: HỦY HẸN AN TOÀN -->
  <div id="cancel-modal" class="modal-backdrop hidden" onclick="if(event.target === this) closeCancelModal()">
    <div class="modal-content p-6 space-y-4">
      <div class="w-11 h-11 rounded-full bg-rose-100 flex items-center justify-center text-clay-alert">
        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="font-serif font-bold text-lg text-ink">Xác nhận hủy lịch hẹn?</h3>
        <p class="text-xs text-ink/70">Khung giờ này sẽ được giải phóng để sinh viên khác có thể đăng ký tham vấn.</p>
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-bold text-ink">Lý do hủy hẹn (tùy chọn):</label>
        <textarea id="cancel-reason-input" rows="2" placeholder="Ví dụ: Trùng lịch thi đột xuất, bận việc cá nhân..."
                  class="w-full bg-paper border border-card-border rounded-xl p-2.5 text-xs text-ink focus:outline-none focus:border-sage"></textarea>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeCancelModal()" class="btn-secondary text-xs !py-1.5">Không, giữ lại</button>
        <button onclick="confirmCancelAppointment()" class="btn-danger text-xs !py-1.5">Xác nhận hủy ca</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="campusmind-footer"></div>

  <!-- Scripts -->
  <script src="../js/modules/data.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/common.js"></script>
  <script>
    let currentFilter = 'all';
    let activeAppointmentId = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Guard RBAC
      CampusAuth.enforceGuard();

      CampusCommon.renderEmergencyBanner();
      CampusCommon.renderHeader('appointments');
      CampusCommon.renderFooter();
      renderAppointmentsList();

      // Check URL query param to open specific appointment drawer
      const urlParams = new URLSearchParams(window.location.search);
      const targetApt = urlParams.get('aptId') || urlParams.get('highlight');
      if (targetApt) {
        setTimeout(() => openDrawer(targetApt), 300);
      }
    });

    function updateTabCounts(appointments) {
      const counts = {
        all: appointments.length,
        confirmed: appointments.filter(a => a.status === 'confirmed').length,
        pending: appointments.filter(a => a.status === 'pending').length,
        completed: appointments.filter(a => a.status === 'completed').length,
        cancelled: appointments.filter(a => a.status === 'cancelled').length
      };

      for (const [status, count] of Object.entries(counts)) {
        const el = document.getElementById(`count-${status}`);
        if (el) el.textContent = `(${count})`;
      }
    }

    function renderAppointmentsList() {
      const container = document.getElementById('appointments-container');
      const all = CampusData.getAppointments();
      const user = CampusAuth.getUser();
      const query = (document.getElementById('appointment-search')?.value || '').toLowerCase().trim();

      // Filter by current student
      const userAppointments = all.filter(a => a.studentId === user.code || a.studentEmail === user.email || user.role === 'admin');

      // Update real-time counts on filter tabs
      updateTabCounts(userAppointments);

      let list = [...userAppointments];

      // Filter by status tab
      if (currentFilter !== 'all') {
        list = list.filter(a => a.status === currentFilter);
      }

      // Filter by search query
      if (query) {
        list = list.filter(a => 
          a.id.toLowerCase().includes(query) ||
          a.counselorName.toLowerCase().includes(query) ||
          a.serviceName.toLowerCase().includes(query) ||
          (a.reason && a.reason.toLowerCase().includes(query))
        );
      }

      // Toggle Reset Button visibility
      const resetBtn = document.getElementById('btn-reset-apt-filter');
      if (resetBtn) {
        if (query || currentFilter !== 'all') {
          resetBtn.classList.remove('hidden');
        } else {
          resetBtn.classList.add('hidden');
        }
      }

      // Empty state (Mockup 15)
      if (list.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center bg-white rounded-3xl border border-card-border p-8 space-y-3">
            <div class="w-16 h-16 rounded-full bg-paper flex items-center justify-center mx-auto text-ink/40">
              <i data-lucide="calendar-x-2" class="w-8 h-8"></i>
            </div>
            <h3 class="font-serif font-bold text-lg text-ink">Chưa có lịch hẹn nào phù hợp</h3>
            <p class="text-xs text-ink/60 max-w-sm mx-auto">
              ${currentFilter === 'all' 
                ? 'Bạn chưa đăng ký lịch hẹn nào. Hãy bắt đầu chọn chuyên viên và khung giờ để nhận hỗ trợ tâm lý nhé.' 
                : 'Không có ca hẹn nào ở trạng thái này hoặc từ khóa tìm kiếm không khớp.'}
            </p>
            <div class="pt-2 flex items-center justify-center gap-2">
              <button onclick="resetAppointmentFilters()" class="btn-secondary text-xs shadow-sm">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>Xóa bộ lọc</span>
              </button>
              <a href="student-booking.html" class="btn-primary text-xs shadow-sm">
                <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                <span>Đặt lịch hẹn ngay</span>
              </a>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = list.map(apt => {
        let pillClass = 'status-confirmed';
        if (apt.status === 'pending') pillClass = 'status-pending';
        else if (apt.status === 'cancelled') pillClass = 'status-cancelled';
        else if (apt.status === 'completed') pillClass = 'status-completed';

        return `
          <div class="interactive-card p-5 sm:p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="space-y-2 flex-1">
              <div class="flex flex-wrap items-center gap-2.5">
                <span class="font-mono text-xs font-bold text-ink/60">#${CampusCommon.escapeHTML(apt.id)}</span>
                <span class="status-pill ${pillClass}">
                  <span class="status-dot"></span>
                  <span>${CampusCommon.escapeHTML(apt.statusDisplay || apt.status)}</span>
                </span>
                <span class="text-xs text-ink/40">·</span>
                <span class="text-xs font-semibold text-sage-deep">${CampusCommon.escapeHTML(apt.serviceName)}</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-ink/80 pt-1">
                <div class="flex items-center gap-2">
                  <i data-lucide="clock" class="w-4 h-4 text-sage shrink-0"></i>
                  <span><b>${CampusCommon.escapeHTML(apt.timeSlot)}</b> · ${CampusCommon.escapeHTML(apt.dateDisplay)}</span>
                </div>
                <div class="flex items-center gap-2">
                  <i data-lucide="user-check" class="w-4 h-4 text-sage shrink-0"></i>
                  <span>Chuyên viên: <b>${CampusCommon.escapeHTML(apt.counselorName)}</b></span>
                </div>
              </div>

              <p class="text-xs text-ink/70 line-clamp-1 italic">
                "${CampusCommon.escapeHTML(apt.reason || 'Không có mô tả chi tiết')}"
              </p>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center gap-2 shrink-0 self-end md:self-center">
              <button onclick="openDrawer('${apt.id}')" class="btn-primary text-xs !py-1.5 !px-3 shadow-sm">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span>Chi tiết ca hẹn</span>
              </button>
              ${apt.status !== 'cancelled' && apt.status !== 'completed' ? `
                <button onclick="openCancelModal('${apt.id}')" class="btn-secondary text-xs !py-1.5 !px-3 text-clay-alert hover:border-clay-alert">
                  <i data-lucide="calendar-x" class="w-3.5 h-3.5"></i>
                  <span>Hủy ca</span>
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function setFilter(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.className = 'filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-card-border text-ink/80 hover:bg-paper';
      });
      btn.className = 'filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-sage-tint text-sage-deep border border-sage';
      renderAppointmentsList();
    }

    function resetAppointmentFilters() {
      const search = document.getElementById('appointment-search');
      if (search) search.value = '';
      currentFilter = 'all';
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.className = 'filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-card-border text-ink/80 hover:bg-paper';
      });
      const firstTab = document.querySelector('#status-filter-tabs button');
      if (firstTab) firstTab.className = 'filter-tab px-3 py-1.5 rounded-full text-xs font-semibold bg-sage-tint text-sage-deep border border-sage';
      renderAppointmentsList();
    }

    // ================= SIDE DRAWER LOGIC (Mockup 14) =================
    function openDrawer(aptId) {
      const all = CampusData.getAppointments();
      const apt = all.find(a => a.id === aptId);
      if (!apt) return;

      activeAppointmentId = aptId;
      const body = document.getElementById('drawer-body');

      let pillClass = 'status-confirmed';
      if (apt.status === 'pending') pillClass = 'status-pending';
      else if (apt.status === 'cancelled') pillClass = 'status-cancelled';
      else if (apt.status === 'completed') pillClass = 'status-completed';

      body.innerHTML = `
        <!-- Drawer Header -->
        <div class="flex items-center justify-between pb-3 border-b border-card-border">
          <div class="flex items-center gap-2">
            <span class="font-mono text-sm font-bold text-ink">#${CampusCommon.escapeHTML(apt.id)}</span>
            <span class="status-pill ${pillClass}">
              <span class="status-dot"></span>
              <span>${CampusCommon.escapeHTML(apt.statusDisplay || apt.status)}</span>
            </span>
          </div>
          <button onclick="closeDrawer()" class="text-ink/40 hover:text-ink">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Service & Counselor Details -->
        <div class="space-y-3">
          <h3 class="font-serif font-bold text-xl text-sage-deep">${CampusCommon.escapeHTML(apt.serviceName)}</h3>
          
          <div class="bg-paper p-4 rounded-2xl border border-card-border space-y-2 text-xs">
            <div class="flex items-center justify-between">
              <span class="text-ink/60">Chuyên viên:</span>
              <span class="font-bold text-ink">${CampusCommon.escapeHTML(apt.counselorName)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-ink/60">Thời gian:</span>
              <span class="font-bold text-ink">${CampusCommon.escapeHTML(apt.timeSlot)} · ${CampusCommon.escapeHTML(apt.dateDisplay)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-ink/60">Hình thức:</span>
              <span class="font-bold text-ink">${CampusCommon.escapeHTML(apt.typeDisplay)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-ink/60">Địa điểm:</span>
              <span class="font-bold text-ink">Phòng P.204 Nhà A1</span>
            </div>
          </div>
        </div>

        <!-- Student Shared Reason -->
        <div class="space-y-1.5">
          <h4 class="font-bold text-xs text-ink">Lý do tham vấn:</h4>
          <div class="p-3 bg-white rounded-xl border border-card-border text-xs text-ink/80 leading-relaxed italic">
            "${CampusCommon.escapeHTML(apt.reason || 'Chưa cung cấp mô tả chi tiết')}"
          </div>
        </div>

        <!-- AI-3 Session Summary if completed or present -->
        ${apt.aiSummary ? `
          <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center gap-1.5">
              <span class="badge-ai">✦ Tóm tắt buổi tham vấn từ AI-3</span>
            </div>
            <p class="text-xs text-ink/80 leading-relaxed">${CampusCommon.escapeHTML(apt.aiSummary)}</p>
            ${apt.aiActionPlan ? `
              <div class="pt-2 border-t border-emerald-200/60">
                <span class="font-bold text-xs text-sage-deep block mb-1">Kế hoạch hành động tiếp theo:</span>
                <ul class="space-y-1 text-xs text-ink/75 pl-4 list-disc">
                  ${apt.aiActionPlan.map(p => `<li>${CampusCommon.escapeHTML(p)}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
          </div>
        ` : ''}

        <!-- Actions -->
        <div class="pt-5 border-t border-card-border space-y-2">
          ${apt.status !== 'cancelled' && apt.status !== 'completed' ? `
            <button onclick="openCancelModal('${apt.id}')" class="btn-danger w-full text-xs !py-2.5 shadow-sm">
              <i data-lucide="x-circle" class="w-4 h-4"></i>
              <span>Yêu cầu hủy lịch hẹn này</span>
            </button>
          ` : ''}
          <button onclick="closeDrawer()" class="btn-secondary w-full text-xs !py-2">
            <span>Đóng cửa sổ</span>
          </button>
        </div>
      `;

      lucide.createIcons();
      document.getElementById('appointment-drawer').classList.remove('hidden');
    }

    function closeDrawer() {
      document.getElementById('appointment-drawer').classList.add('hidden');
    }

    // ================= CANCEL MODAL LOGIC =================
    function openCancelModal(aptId) {
      activeAppointmentId = aptId;
      document.getElementById('cancel-modal').classList.remove('hidden');
    }

    function closeCancelModal() {
      document.getElementById('cancel-modal').classList.add('hidden');
    }

    function confirmCancelAppointment() {
      if (!activeAppointmentId) return;
      const reason = document.getElementById('cancel-reason-input').value.trim() || 'Sinh viên yêu cầu hủy hẹn.';
      CampusData.updateAppointmentStatus(activeAppointmentId, 'cancelled', reason);
      closeCancelModal();
      closeDrawer();
      CampusCommon.showToast(`Đã hủy ca hẹn #${activeAppointmentId} an toàn.`, 'info');
      renderAppointmentsList();
    }
  </script>
</body>
</html>
