<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập & Chuyển Vai Trò | CampusMind TLU</title>

  <!-- Google Fonts: Fraunces & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: '#2F7A66',
            'sage-deep': '#1C5344',
            'amber-ai': '#D79B34',
            'clay-alert': '#C4643F',
            ink: '#16241D',
            paper: '#F2EEE6',
            'sage-tint': '#DCEAE3',
            'sky-info': '#3B6E92',
            'card-border': '#E4DDD4',
          },
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CampusMind Core Styles -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-paper text-ink min-h-screen flex flex-col font-sans justify-between">

  <!-- Minimal Header -->
  <header class="py-4 px-6 max-w-6xl w-full mx-auto flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-sage-deep text-white flex items-center justify-center shadow-sm">
        <i data-lucide="heart-handshake" class="w-4 h-4 text-emerald-300"></i>
      </div>
      <span class="font-serif font-bold text-base text-ink">CampusMind</span>
    </a>
    <a href="../index.html" class="text-xs font-semibold text-ink/70 hover:text-sage flex items-center gap-1">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Về trang chủ</span>
    </a>
  </header>

  <!-- Main Center Card (Matching Mockup 24) -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="max-w-[440px] w-full bg-white rounded-3xl p-7 sm:p-8 border border-card-border shadow-xl space-y-6">

      <!-- Header Info -->
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-sage-tint text-sage-deep flex items-center justify-center mx-auto shadow-sm">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="font-serif text-2xl font-bold text-ink">Đăng nhập CampusMind</h1>
        <p class="text-xs text-ink/65">Cổng điều phối sức khỏe tinh thần sinh viên ĐH Thủy Lợi</p>
      </div>

      <!-- Standard Login Form -->
      <form onsubmit="handleManualLogin(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="font-bold text-ink block mb-1">Email hoặc Mã sinh viên:</label>
          <input type="text" id="login-identifier" required placeholder="Ví dụ: vuphucpa@gmail.com hoặc 2551060661"
                 value="vuphucpa@gmail.com"
                 class="w-full bg-paper border border-card-border rounded-xl p-3 text-ink focus:outline-none focus:border-sage shadow-sm">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-bold text-ink">Mật khẩu:</label>
            <a href="javascript:void(0)" onclick="CampusCommon.showToast('Vui lòng liên hệ Phòng CTSV để cấp lại mật khẩu', 'info')" class="text-[11px] text-sage hover:underline">Quên mật khẩu?</a>
          </div>
          <div class="relative">
            <input type="password" id="login-password" required value="campusmind123"
                   class="w-full bg-paper border border-card-border rounded-xl p-3 pr-10 text-ink focus:outline-none focus:border-sage shadow-sm">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink/40 hover:text-ink">
              <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-[11px] text-ink/75">
            <input type="checkbox" checked class="rounded text-sage focus:ring-sage">
            <span>Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <button type="submit" class="btn-primary w-full text-xs !py-3 shadow-md">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Đăng nhập hệ thống</span>
        </button>
      </form>

      <!-- 1-CLICK ROLE SWITCHER (BTL Showcase requirement) -->
      <div class="space-y-2.5 pt-4 border-t border-card-border">
        <div class="flex items-center justify-between text-[11px]">
          <span class="font-bold text-amber-900 uppercase tracking-wide flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-ai"></i>
            <span>1-Click Chuyển nhanh 4 vai trò demo:</span>
          </span>
          <span class="text-[10px] text-ink/40 font-mono">BTL-02</span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <!-- Student -->
          <button type="button" onclick="quickLoginRole('student', 'student-dashboard.html')"
                  class="p-2.5 rounded-xl border border-sage bg-sage-tint/50 hover:bg-sage-tint text-left transition-all">
            <span class="font-bold text-sage-deep block text-xs">🎓 Sinh viên</span>
            <span class="text-[10px] text-ink/65 truncate block">Vũ Hồng Phúc</span>
          </button>

          <!-- Counselor -->
          <button type="button" onclick="quickLoginRole('counselor', 'counselor-appointment-queue.html')"
                  class="p-2.5 rounded-xl border border-sky-200 bg-sky-50 hover:bg-sky-100 text-left transition-all">
            <span class="font-bold text-sky-800 block text-xs">🧑‍⚕️ Chuyên viên</span>
            <span class="text-[10px] text-ink/65 truncate block">TS. Minh Hà</span>
          </button>

          <!-- Admin -->
          <button type="button" onclick="quickLoginRole('admin', 'admin-dashboard.html')"
                  class="p-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white hover:bg-slate-800 text-left transition-all">
            <span class="font-bold text-amber-300 block text-xs">🛡️ Quản trị viên</span>
            <span class="text-[10px] text-white/70 truncate block">Admin Đức</span>
          </button>

          <!-- Guest -->
          <button type="button" onclick="quickLoginRole('guest', 'index.html')"
                  class="p-2.5 rounded-xl border border-card-border bg-paper hover:bg-card-border/50 text-left transition-all">
            <span class="font-bold text-ink block text-xs">👤 Khách</span>
            <span class="text-[10px] text-ink/65 truncate block">Chưa đăng nhập</span>
          </button>
        </div>
      </div>

      <!-- Registration link -->
      <div class="text-center text-xs text-ink/60 pt-2 border-t border-card-border">
        Chưa có tài khoản sinh viên? 
        <a href="register.html" class="font-bold text-sage hover:underline">Đăng ký ngay tại đây</a>
      </div>

    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="py-4 text-center text-[11px] text-ink/50 border-t border-card-border/50">
    Hệ thống xác thực chuẩn TLU SSO · CampusMind BTL-02 CSE122
  </footer>

  <!-- Scripts -->
  <script src="../js/modules/data.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function quickLoginRole(role, targetUrl) {
      CampusAuth.switchRole(role, targetUrl);
    }

    function handleManualLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim().toLowerCase();
      const users = CampusData.getUsers();

      // Find user
      const user = users.find(u => 
        u.email.toLowerCase() === identifier || 
        u.code.toLowerCase() === identifier ||
        u.username.toLowerCase() === identifier
      );

      if (user) {
        if (user.status === 'suspended') {
          CampusCommon.showToast('Tài khoản này hiện đang bị tạm khóa. Vui lòng liên hệ ban quản trị.', 'error');
          return;
        }
        CampusAuth.switchRole(user.role);
      } else {
        // Fallback default student
        CampusAuth.switchRole('student', 'student-dashboard.html');
      }
    }
  </script>
</body>
</html>
